nospace,monospace;color:#3b8070;letter-spacing:2px}.preview-doc h2{font-size:28px;line-height:1.14;margin:17px 0;font-weight:650;letter-spacing:-.6px}.preview-doc p{font-size:13px;line-height:1.7;color:#61727b}.preview-doc table{border-collapse:collapse;width:100%;font-size:12px;margin:22px 0}.preview-doc td{padding:13px 7px;border-bottom:1px solid #ccd8d1}.preview-doc tr:first-child{background:#e6ede7;font-weight:600}.doc-footer{display:flex;align-items:center;gap:8px;font-size:11px;color:#4f796b;margin-top:23px}.doc-footer i{height:5px;width:5px;background:#4b9b80;border-radius:50%}.scan-wrap{position:relative;margin:16px auto 0;width:325px;height:375px;overflow:hidden;background:#fff;border-radius:4px;box-shadow:0 12px 35px #0005}.scan-wrap img{position:absolute;width:325px;height:auto;left:0;top:0}.ocr-box{position:absolute;border:1.2px solid #17ae85;background:#1ddc9b12;border-radius:2px;box-shadow:0 0 9px #22d6a120}.ocr-box.active{background:#1ddc9b35;border-color:#00996d;box-shadow:0 0 14px #18dcb157}.ocr-box .box-label{position:absolute;right:-1px;top:-14px;color:white;background:#078963;padding:1px 4px;font:8px/1.3 ui-monospace,monospace;border-radius:3px 3px 0 0;white-space:nowrap}.scan-line{position:absolute;left:0;right:0;height:2px;background:#00b17d;box-shadow:0 0 18px 5px #19f9b122}.geometry-note{position:absolute;left:18px;right:18px;bottom:8px;display:flex;align-items:center;justify-content:space-between;color:#a7d4c6;font-size:10px}.side-foot{position:absolute;bottom:0;left:0;right:0;border-top:1px solid #2a3d37;padding:13px 17px;font-size:10px;color:#78a491;display:flex;justify-content:space-between}.footer{position:relative;display:flex;justify-content:space-between;align-items:center;margin-top:21px}.chapter{font-size:10px;letter-spacing:1.3px;color:#a3b7c3}.chapter strong{color:#94f6d8;margin-right:8px}.tracks{display:flex;gap:6px;margin-top:12px}.track{height:3px;width:67px;border-radius:3px;background:#23343d;overflow:hidden}.track i{display: <div class="top"><div class="brand"><div class="mark">f</div>filens</div><div class="badge">LOCAL FIRST · AGENT READY</div></div>
<div class="hero"><h1>One file. <span>Every useful layer.</span></h1><p>自然语言读取文档，把文字、结构与坐标交给你的 Agent。</p></div>
<div class="workspace"><div class="terminal"><div class="chrome"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="name">filens — ~/documents</span><span class="platform">native · WASM</span></div><div class="terminal-body"><div class="location">~/documents</div><div class="command"><span class="prompt">❯</span><span id="command"></span><i id="cursor" class="cursor"></i></div><div class="output-label" id="output-label"></div><pre id="output" class="output"></pre></div></div><div class="side"><div class="side-head"><span id="side-title"></span><span class="status" id="status">OFFLINE</span></div><div class="right-content" id="right"></div><div class="side-foot"><span id="side-foot"></span><span id="side-count"></span></div></div></div>
<div class="footer"><div><div class="chapter"><strong id="chapter-number"></strong><span id="chapter"></span></div><div class="tracks" id="tracks"></div></div><div class="install"><span>$</span> npm install -g filens-cli</div></div><div class="fine"><span>Actual CLI results · excerpts shown · typing and response timing edited</span><span id="summary"></span></div>
<script>
const d=window.DEMO;
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const stages=[
 {start:0,end:6200,title:'ASK IN YOUR OWN WORDS',command:d.capacity.command,output:d.capacity.excerpt,label:'stdout excerpt · capacity',side:'DISCOVER THE CAPABILITIES'},
 {start:6200,end:13200,title:'FROM DOCUMENT TO MARKDOWN',command:d.markdown.command,output:d.markdown.output,label:'stdout · Markdown',side:'REAL DOCUMENT STRUCTURE'},
 {start:13200,end:22000,title:'MAKE THE INVISIBLE VISIBLE',command:d.layout.command,output:d.layout.excerpt,label:'stdout excerpt · content.layout',side:'OCR → TEXT + COORDINATES'},
 {start:22000,end:28500,title:'STRUCTURED FOR YOUR AGENT',command:d.yaml.command,output:d.yaml.excerpt,label:'stdout excerpt · content.layout',side:'ONE SOURCE. MULTIPLE OUTPUTS'}
];
function highlight(value,stage){if(stage===1)return value.split('\n').map(s=>s.startsWith('#')?`<span class="md-heading">${esc(s)}</span>`:s.startsWith('|')?`<span class="md-table">${esc(s)}</span>`:esc(s)).join('\n');return esc(value).replace(/(&quot;.*?&quot;)/g,'$1').replace(/("(?:[^"\\]|\\.)*")\s*(:)?|\b(\d+(?:\.\d+)?|true|false)\b/g,(v,s,key,num)=>s?`<span class="${key?'key':'string'}">${s}</span>${key?':':''}`:`<span class="number">${num}</span>`)}
const capVisual=`<div class="cap-visual"><div class="small-label">SHARED WASM CORE</div><div class="cap-title">${d.inputCount} formats.<br>One way to read.</div><div class="file-chips">${['PDF','DOCX','XLSX','Pages','Keynote','PNG','…'].map(s=>`<span>${s}</span>`).join('')}</div><div class="cap-note"><span class="flow-arrow">↗</span>Text. Structure. Source evidence.<br>Native OCR. No Python.<br>语义推理由你的 Agent 完成。</div></div>`;
const docVisual=`<article class="preview-doc"><div class="eyebrow">LAUNCH-BRIEF.DOCX</div><h2>Aurora<br>launch brief</h2><p>Read locally.<br>Keep the evidence.</p><table><tr><td>Milestone</td><td>Status</td></tr><tr><td>Native OCR</td><td>Ready</td></tr></table><div class="doc-footer"><i></i> Heading + paragraphs + table cells</div></article>`;
function scanned(progress,final){const w=325/d.imageWidth;const limit=final?d.boxes.length:Math.min(d.boxes.length,Math.floor(progress*d.boxes.length*1.3));const active=limit===d.boxes.length?d.focusIndex:limit-1;return `<div class="scan-wrap"><img src="${d.image}">${d.boxes.slice(0,limit).map((b,i)=>`<div class="ocr-box ${i===active?'active':''}" style="left:${b.bounds.x*w}px;top:${b.bounds.y*w}px;width:${b.bounds.width*w}px;height:${b.bounds.height*w}px;opacity:${final?1:Math.min(1,Math.max(0,progress*d.boxes.length*1.3-i)*3)}">${i===active?`<span class="box-label">${b.id} · ${Math.round(b.detectionScore*100)}% det.</span>`:''}</div>`).join('')}${!final&&progress<.9?`<div class="scan-line" style="top:${Math.min(365,progress*440)}px"></div>`:''}</div><div class="geometry-note"><span>${d.imageWidth} × ${d.imageHeight} px · top-left origin</span><span>${limit} text regions</span></div>`}
window.renderAt=t=>{let index=stages.findIndex(s=>t>=s.start&&t<s.end);if(index<0)index=3;const s=stages[index],local=t-s.start;const typed=Math.floor(Math.max(0,local-250)*.035);document.querySelector('#command').textContent=s.command.slice(0,typed);document.querySelector('#cursor').style.opacity=typed<s.command.length?(Math.floor(t/360)%2?'0':'1'):'0';const ready=250+s.command.length/.035+330;const outputChars=Math.floor(Math.max(0,local-ready)*1.2);const progress=Math.max(0,(local-ready)/3700);let printed=s.output;if(index===2){const limit=Math.min(d.boxes.length,Math.floor(progress*d.boxes.length*1.3));const b=d.boxes[limit===d.boxes.length?d.focusIndex:Math.max(0,limit-1)];printed=`{\n  "version": "${d.layout.version}",\n  "pages": [${JSON.stringify(d.layout.pages[0])}],\n  "blocks": [{\n    "id": "${b.id}", "kind": "${b.kind}",\n    "bounds": ${JSON.stringify(b.bounds)},\n    "coordinateSpace": "${b.coordinateSpace}",\n    "detectionScore": ${b.detectionScore}\n  }]\n}`;}document.querySelector('#output').innerHTML=highlight(printed.slice(0,outputChars),index);document.querySelector('#output-label').textContent=local>ready?s.label:' ';document.querySelector('#side-title').textContent=s.side;document.querySelector('#right').innerHTML=index===0?capVisual:index===1?docVisual:scanned(Math.max(0,(local-ready)/3700),index===3);document.querySelector('#side-foot').textContent=index===0?'Zero uploads · runs locally':index===1?'Heading levels + real table cells':'Detected geometry, aligned with source pixels';document.querySelector('#side-count').textContent=index<2?'WASM':'RapidOCR · NCNN';document.querySelector('#chapter-number').textContent=`0${index+1}`;document.querySelector('#chapter').textContent=s.title;document.querySelector('#tracks').innerHTML=stages.map((stage,i)=>`<div class="track"><i style="width:${i<index?100:i===index?Math.min(100,(t-stage.start)/(stage.end-stage.start)*100):0}%"></i></div>`).join('');document.querySelector('#summary').textContent=`${d.inputCount} input formats · 8 output formats · max side 960 · threads 2`;document.querySelector('#status').textContent=index>1?'SOURCE ALIGNED':'OFFLINE';};
window.renderAt(0);
</script></html>
