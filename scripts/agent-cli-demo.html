<script>
const d=window.DEMO;

 {start:0,end:7000,type:'layout',title:tr('MAKE THE INVISIBLE VISIBLE','让图像中的文字与坐标可见'),command:d.layout.command,output:d.layout.excerpt,label:tr('stdout excerpt · content.layout','标准输出节选 · 布局信息'),side:tr('OCR → TEXT + COORDINATES','OCR → 文字 + 坐标')},

 {start:11000,end:16500,type:'pruning',title:tr('KEEP THE SIGNAL','无需模型，提取关键原文'),command:d.pruning.command,output:d.pruning.output,label:tr('stdout · original key excerpts','标准输出 · 关键原文摘录'),side:tr('KEY EXCERPTS. NO MODEL.','保留重点，不需要模型')},
 {start:16500,end:23500,type:'retrieval',title:tr('SEARCH INSIDE NESTED ARCHIVES','搜到嵌套压缩包里的合同'),command:d.retrieval.command,output:d.retrieval.output,label:tr('stdout excerpt · archive search · relative paths','标准输出节选 · 压缩包搜索 · 相对路径'),side:tr('ZIP → ZIP → MATCHING DOCUMENT','ZIP → ZIP → 命中文档')},
 {start:23500,end:29000,type:'archiveRead',title:tr('OPEN THE MATCH. READ THE SOURCE.','直接读取命中的包内原文'),command:d.archiveRead.command,output:d.archiveRead.output,label:tr('stdout · Markdown · archive member','标准输出 · Markdown · 包内文档'),side:tr('SEARCH RESULT → ORIGINAL CONTENT','搜索结果 → 原始内容')},
 {start:29000,end:33500,type:'duplicates',title:tr('DIFFERENT NAMES. IDENTICAL FILES.','名字不同，内容完全相同'),command:d.duplicateScan.command,output:d.duplicateScan.output,label:tr('stdout excerpt · duplicate group','标准输出节选 · 重复文件分组'),side:tr('VERIFY THE WHOLE FILE','用完整文件哈希核对')},

 {start:39500,end:45000,type:'conversion',title:tr('TURN CSV INTO A WORKBOOK','CSV 转成可以打开的 Excel 表格'),command:d.conversion.command,output:d.conversion.output,label:tr('stdout excerpt · real WASM conversion','标准输出节选 · 真实 WASM 转换'),side:tr('CSV → XLSX · ACTUAL OUTPUT FILE','CSV → XLSX · 生成实际文件')},
 {start:45000,end:50000,type:'workbook',title:tr('PREVIEW THE FILE YOU JUST CREATED','直接预览刚刚转换出的表格'),command:d.workbookPreview.command,output:d.workbookPreview.output,label:tr('stdout · preview URL · shortened token','标准输出 · 预览地址 · 令牌缩写'),side:tr('CLI OUTPUT → BROWSER PREVIEW','CLI 产物 → 浏览器预览')},
 {start:50000,end:57000,type:'preview',title:tr('OPEN A STEP FILE. EXPLORE IN 3D.','终端打开 STEP，旋转查看 3D'),command:d.modelPreview.command,output:d.modelPreview.output,label:tr('stdout · preview URL · shortened token','标准输出 · 预览地址 · 令牌缩写'),side:tr('LOCAL FILE → INTERACTIVE 3D','本地文件 → 交互式 3D')},
 {start:57000,end:60000,type:'capacity',title:tr('ASK IN YOUR OWN WORDS','用自己的话，发现能力'),command:d.capacity.command,output:d.capacity.excerpt,label:tr('stdout excerpt · capacity','标准输出节选 · 能力清单'),side:tr('DISCOVER THE CAPABILITIES','发现本地文档能力')}
];
window.demoStages=stages;
function highlight(value,stage){if(['markdown','archiveRead'].includes(stage))return value.split('\n').map(s=>s.startsWith('#')?`<span class="md-heading">${esc(s)}</span>`:s.startsWith('|')?`<span class="md-table">${esc(s)}</span>`:esc(s)).join('\n');if(stage==='pruning')return esc(value);return esc(value).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|\b(\d+(?:\.\d+)?|true|false)\b/g,(v,s,key,num)=>s?`<span class="${key?'key':'string'}">${s}</span>${key??''}`:`<span class="number">${num}</span>`)}

const excerptText=e=>new TextDecoder().decode(summaryBytes.slice(e.startByte,e.endByte));
const shownExcerpts=d.summary.excerpts.filter(e=>excerptText(e).length>=20).slice(0,3);
const pruneVisual=`<div class="summary-card"><div class="small-label">${tr('ORIGINAL TEXT → KEY EXCERPTS','完整原文 → 关键摘录')}</div><div class="summary-stats"><strong>${d.summary.sourceCharacters}</strong><span>→</span><strong>${d.summary.characters}</strong></div><div class="summary-note">${tr(`${Math.round((1-d.summary.retainedRatio)*100)}% less text · no model · source preserved`,`减少 ${Math.round((1-d.summary.retainedRatio)*100)}% 文字 · 无模型 · 保留出处`)}</div><div class="extract-list">${shownExcerpts.map(e=>`<div class="extract-line"><small>meeting-notes.txt · ${tr('line','第')} ${e.sourceStartLine}${tr('',' 行')}</small>${esc(excerptText(e))}</div>`).join('')}</div><div class="search-note">${tr(`${shownExcerpts.length} of ${d.summary.excerpts.length} excerpts shown`,`展示 ${d.summary.excerpts.length} 段中的 ${shownExcerpts.length} 段摘录`)}</div></div>`;
const archiveVisual=`<div class="archive-card"><div class="small-label">${tr('NESTED ARCHIVES · LOCAL BM25','嵌套压缩包 · 本地 BM25')}</div><h2 class="search-title">${tr('Find the contract inside.','层层压缩，仍然找到。')}</h2><div class="archive-tree">documents.zip<div class="nested">attachments.zip<div class="nested match">contract.docx</div></div></div><div class="archive-evidence"><strong>${tr('MATCHED · ORIGINAL EXCERPT + LINE','已匹配 · 原文片段与行号')}</strong>${tr('Budget limit: 12345.67 CNY.<br>Risk: late delivery needs approval.','预算上限：12345.67 元。<br>风险：交付延期需审批。')}</div><div class="search-note">${tr(`${d.search.matchedFiles} matching document · original offsets verified<br>Read the returned !/ path directly`,`${d.search.matchedFiles} 份命中文档 · 原文偏移已核对<br>直接读取返回的 !/ 路径`)}</div></div>`;
const archiveReadVisual=`<article class="preview-doc"><div class="eyebrow">DOCUMENTS.ZIP / ATTACHMENTS.ZIP / CONTRACT.DOCX</div><h2>${tr('Aurora purchase<br>agreement','极光项目<br>采购合同')}</h2><p>${tr('Budget limit: 12345.67 CNY.<br>Risk: late delivery needs approval.','预算上限：12345.67 元。<br>风险：交付延期需审批。')}</p><table><tr><td>${tr('Clause','条款')}</td><td>${tr('Requirement','要求')}</td></tr><tr><td>${tr('Extra spending','新增支出')}</td><td>${tr('Prior approval','事先审批')}</td></tr></table><div class="doc-footer"><i></i>${tr('Read directly from the returned archive path','按搜索结果的包内路径，直接读取')}</div></article>`;
const conversionVisual=`<div class="conversion-card"><div class="small-label">${tr('SHARED WASM · REAL FILE CONVERSION','共享 WASM · 真实文件转换')}</div><h2 class="search-title">${tr('From rows to a workbook.','从文本数据到 Excel。')}</h2><div class="conversion-formats"><span class="format-tag">CSV</span><span class="convert-arrow">→</span><span class="format-tag">XLSX</span></div><pre class="csv-source">${esc(d.csv)}</pre><div class="search-note">${tr('Actual budget.csv input shown above.<br>Next: open the converted file in the shared viewer.','上方展示实际 budget.csv 输入。<br>下一步：用共享预览器打开转换产物。')}</div></div>`;
function browserVisual(preview,frame=0,model=false){return `<div class="browser-card"><div class="small-label">${tr('ACTUAL CLI-SERVED VIEWER CAPTURE','CLI 本地服务 · 真实预览画面')}</div><h2 class="search-title">${model?tr('A STEP file. A new angle.','换个角度，看 STEP 模型。'):tr('Open the workbook you made.','打开刚刚转换出的表格。')}</h2><div class="browser-window ${model?'model':''}"><div class="browser-address"><span>127.0.0.1</span><span>${esc(preview.name)}</span></div><img src="${preview.frames[frame]}" alt="${model?'Actual STEP preview':'Actual converted workbook preview'}"></div><div class="search-note">${model?tr('Real pointer drag · shared STEP renderer<br>Browser preview works offline with assets installed.','真实鼠标拖动 · 共享 STEP 渲染器<br>预览资源就绪后，可离线打开。'):tr('The actual XLSX generated in the previous scene.<br>Cells and values verified after conversion.','上一幕实际生成的 XLSX 文件。<br>转换后的单元格与数值已核对。')}</div></div>`}
const duplicateVisual=`<div class="duplicate-card"><div class="small-label">${tr('SIZE → PREFIX → FULL SHA-256','大小 → 前缀 → 完整 SHA-256')}</div><h2 class="search-title">${tr('Two names. One file.','两个名字，同一份内容。')}</h2><div class="duplicate-pair">${d.duplicates.groups[0].files.map(f=>`<div class="duplicate-file"><div class="document-icon">DOCX</div><div><code>files/${esc(f.path)}</code><small>${f.bytes} ${tr('bytes','字节')}</small></div></div>`).join('')}</div><div class="hash-proof">${tr('Full-file hashes match','完整文件哈希一致')}<code>SHA-256 ${d.duplicates.groups[0].sha256.slice(0,24)}…</code></div><div class="search-note">${tr('One verified group · results for review','一组已核对的重复文件 · 返回分组供检查')}</div></div>`;
const imageVisual=`<div class="images-card"><div class="small-label">${tr('PERCEPTUAL HASH · NO MODEL','感知哈希 · 无需模型')}</div><h2 class="search-title">${tr('Different sizes. Same scene.','尺寸不同，同一张图。')}</h2><div class="image-variants">${d.photos.map(f=>`<div class="image-variant"><img src="${f.image}"><code>${esc(f.path)}</code><small>${f.width} × ${f.height}<br>${tr('distance','距离')} ${f.distanceToReference}</small></div>`).join('')}</div><div class="group-pill">${tr(`${d.photos.length} variants → ${d.similar.matchedGroups} group`,`${d.photos.length} 个版本 → ${d.similar.matchedGroups} 组`)}</div><div class="search-note">${tr(`Hamming distance ≤ ${d.similar.threshold} · not a confidence percentage<br>Original, resized JPEG and recompressed WebP`,`汉明距离 ≤ ${d.similar.threshold} · 不是置信度百分比<br>原图、缩小的 JPEG 与重压缩的 WebP`)}</div></div>`;
function scanned(progress,final){const w=325/d.imageWidth;const limit=final?d.boxes.length:Math.min(d.boxes.length,Math.floor(progress*d.boxes.length*1.3));const active=limit===d.boxes.length?d.focusIndex:limit-1;return `<div class="scan-wrap"><img src="${d.image}">${d.boxes.slice(0,limit).map((b,i)=>`<div class="ocr-box ${i===active?'active':''}" style="left:${b.bounds.x*w}px;top:${b.bounds.y*w}px;width:${b.bounds.width*w}px;height:${b.bounds.height*w}px;opacity:${final?1:Math.min(1,Math.max(0,progress*d.boxes.length*1.3-i)*3)}">${i===active?`<span class="box-label">${b.id} · ${Math.round(b.detectionScore*100)}% ${tr('det.','检测')}</span>`:''}</div>`).join('')}${!final&&progress<.9?`<div class="scan-line" style="top:${Math.min(365,progress*440)}px"></div>`:''}</div><div class="geometry-note"><span>${d.imageWidth} × ${d.imageHeight} px · ${tr('top-left origin','左上角原点')}</span><span>${limit} ${tr('text regions','个文字区域')}</span></div>`}
window.renderAt=async t=>{
 window.demoTime=t;
 let index=stages.findIndex(s=>t>=s.start&&t<s.end);if(index<0)index=stages.length-1;
 const s=stages[index],local=t-s.start,typingMs=Math.min(1500,(s.end-s.start)*.3),typed=Math.floor(Math.max(0,local-200)*s.command.length/typingMs);
 document.querySelector('#command').textContent=s.command.slice(0,typed);
 document.querySelector('#cursor').style.opacity=typed<s.command.length?(Math.floor(t/360)%2?'0':'1'):'0';
 const ready=200+typingMs+250,outputChars=Math.floor(Math.max(0,local-ready)*1.4),progress=Math.max(0,(local-ready)/3500);
 let printed=s.output;
 if(s.type==='layout'){
  const limit=Math.min(d.boxes.length,Math.floor(progress*d.boxes.length*1.3)),b=d.boxes[limit===d.boxes.length?d.focusIndex:Math.max(0,limit-1)];
  printed=`{\n  "version": "${d.layout.version}",\n  "pages": [${JSON.stringify(d.layout.pages[0])}],\n  "blocks": [{\n    "id": "${b.id}", "kind": "${b.kind}",\n    "bounds": ${JSON.stringify(b.bounds)},\n    "coordinateSpace": "${b.coordinateSpace}",\n    "detectionScore": ${b.detectionScore}\n  }]\n}`;
 }
 document.querySelector('#output').innerHTML=highlight(printed.slice(0,outputChars),s.type);
 document.querySelector('#output-label').textContent=local>ready?s.label:' ';
 document.querySelector('#side-title').textContent=s.side;
 const orbitProgress=Math.max(0,Math.min(1,(local-ready)/(s.end-s.start-ready-300)));
 const orbitFrame=Math.floor(orbitProgress*(d.modelPreview.frames.length-1));
 const visuals={capacity:capVisual,markdown:docVisual,pruning:pruneVisual,retrieval:archiveVisual,archiveRead:archiveReadVisual,duplicates:duplicateVisual,images:imageVisual,conversion:conversionVisual};
 document.querySelector('#right').innerHTML=s.type==='preview'?browserVisual(d.modelPreview,orbitFrame,true):s.type==='workbook'?browserVisual(d.workbookPreview):visuals[s.type]??scanned(progress,false);
 const foot={capacity:tr('Zero uploads · optional preview assets installed','无需上传 · 已准备可选预览资源'),markdown:tr('Heading levels + real table cells','标题级别 + 真实表格单元格'),pruning:tr('Original excerpts · explicit omissions','原文摘录 · 明确标记省略'),retrieval:tr('Original excerpts, line numbers and offsets','原文片段、行号与偏移'),archiveRead:tr('Nested member · no manual unpacking','嵌套包内文档 · 无需手动解压'),duplicates:tr('Compare complete content · review the group','对比完整内容 · 核对文件分组'),images:tr('Image variants · hashes and distances from the core','图片变体 · 核心返回真实哈希与距离'),conversion:tr('Actual CSV → XLSX output · shared core','真实 CSV → XLSX 产物 · 共享核心'),workbook:tr('Conversion output opened through filens preview','通过 filens preview 打开转换结果'),preview:tr('CLI loopback server · actual STEP orbit captures','CLI 本地服务 · 真实 STEP 旋转画面')};
 document.querySelector('#side-foot').textContent=foot[s.type]??tr('Detected geometry, aligned with source pixels','真实检测框，与原图像素对齐');
 document.querySelector('#side-count').textContent=s.type==='layout'?'RapidOCR · NCNN':['workbook','preview'].includes(s.type)?'FRONTEND':'WASM';
 document.querySelector('#chapter-number').textContent=String(index+1).padStart(2,'0');
 document.querySelector('#chapter').textContent=s.title;
 document.querySelector('#tracks').innerHTML=stages.map((stage,i)=>`<div class="track"><i style="width:${i<index?100:i===index?Math.min(100,(t-stage.start)/(stage.end-stage.start)*100):0}%"></i></div>`).join('');
 document.querySelector('#summary').textContent=tr(`${d.inputCount} input formats · 8 output formats · optional local viewer`,`${d.inputCount} 种输入格式 · 8 种输出格式 · 可选本地预览器`);
 document.querySelector('#status').textContent=s.type==='layout'?tr('SOURCE ALIGNED','原图对齐'):tr('OFFLINE','本地离线');
 await Promise.all([...document.images].map(image=>image.decode()));
};
window.renderAt(0);
</script></html>
