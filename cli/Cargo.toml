[package]
name = "filens-cli"
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "filens"
path = "src/main.rs"

[features]
lite = []

[dependencies]
anyhow = "1.0"
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
libloading = "0.8.9"
png = "0.18"
regex = { version = "1.12", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.23"
wasmi = { version = "=0.46.0", default-features = false, features = ["std"] }
wasmi_wasi = "=0.46.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
