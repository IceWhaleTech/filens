[package]
name = "converter-core-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "converter-core"
path = "src/main.rs"

[dependencies]
quick-xml = "0.38.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
zip = { version = "4.3.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
