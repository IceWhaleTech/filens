[package]
name = "converter-core-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "converter-core"
path = "src/main.rs"

[[bin]]
name = "converter-text"
path = "src/text_main.rs"
required-features = ["text-extraction"]

[features]
text-extraction = ["dep:calamine", "dep:iwork", "dep:djvu-rs", "dep:sha2", "dep:acadrust", "dep:cadkit-core", "dep:raster-codec", "dep:matfile", "dep:fitsrs"]

[dependencies]
png = "0.18.0"
quick-xml = "0.38.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
zip = { version = "4.3.0", default-features = false, features = ["deflate"] }
calamine = { version = "=0.37.0", optional = true }
iwork = { version = "=0.4.0", optional = true }
djvu-rs = { version = "=0.43.0", optional = true }
acadrust = { version = "=0.6.8", default-features = false, optional = true }
cadkit-core = { version = "=0.5.1", optional = true }
sha2 = { version = "0.10", optional = true }
raster-codec = { package = "image", version = "=0.25.10", default-features = false, features = ["pnm", "hdr", "exr"], optional = true }
matfile = { version = "=0.5.0", optional = true }
fitsrs = { version = "=0.4.1", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
