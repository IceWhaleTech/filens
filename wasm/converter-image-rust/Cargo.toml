[package]
name = "converter-image-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "converter-image"
path = "src/main.rs"

[dependencies]
jpeg-encoder = { version = "0.7.1", default-features = false }
memchr = "2.8.3"
rawloader = { version = "0.37.2", path = "vendor/rawloader" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
