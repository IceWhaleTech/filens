  <rect x="12" y="12" width="1000" height="1000" rx="224" fill="url(#tile)"/>
  <rect x="12" y="12" width="1000" height="1000" rx="224" fill="url(#ambient)"/>
  <rect x="13.5" y="13.5" width="997" height="997" rx="222.5" fill="none" stroke="url(#tileEdge)" stroke-width="3"/>
  <rect x="25" y="25" width="974" height="974" rx="213" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2"/>
  <g transform="rotate(-3 434 477)" filter="url(#paperShadow)">
    <use href="#document" fill="url(#paper)"/>
    <g clip-path="url(#documentClip)">
      <rect x="214" y="170" width="440" height="614" fill="url(#cyan)"/>
      <rect x="214" y="170" width="440" height="614" fill="url(#violet)"/>
      <rect x="214" y="170" width="440" height="614" fill="url(#pink)"/>
      <rect x="214" y="170" width="440" height="614" fill="url(#orange)"/>
      <rect x="214" y="170" width="440" height="614" fill="url(#paperLight)"/>
      <path d="M228 636C315 550 314 427 439 396S588 338 663 275" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="86" filter="url(#soft)"/>
    </g>
    <use href="#document" fill="none" stroke="#ffffff" stroke-opacity=".58" stroke-width="3"/>
    <path d="M574 172V226Q574 252 600 252H654Z" fill="url(#fold)" stroke="#ffffff" stroke-opacity=".65" stroke-width="2" filter="url(#foldShadow)"/>
    <path d="M287 339H449M287 399H398" fill="none" stroke="#ffffff" stroke-opacity=".94" stroke-width="23" stroke-linecap="round"/>
  </g>
  <g filter="url(#lensShadow)">
    <path d="M774 767L847 840" fill="none" stroke="url(#handle)" stroke-width="59" stroke-linecap="round"/>
    <path d="M780 762L853 835" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
    <circle cx="650" cy="638" r="201" fill="url(#glass)" stroke="url(#rim)" stroke-width="5"/>
    <circle cx="650" cy="638" r="190" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="2"/>
    <circle cx="650" cy="638" r="167" fill="url(#metal)"/>
    <circle cx="650" cy="638" r="161" fill="url(#body)"/>
    <circle cx="650" cy="638" r="157" fill="url(#bodyEdge)"/>
    <path d="M518 587A143 143 0 0 1 737 518" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="650" cy="638" r="106" fill="#080c1c" stroke="#b5c5e7" stroke-opacity=".4" stroke-width="2"/>
    <circle cx="650" cy="638" r="101" fill="url(#optics)"/>
    <circle cx="650" cy="638" r="101" fill="url(#opticGlow)"/>
    <g clip-path="url(#opticsClip)">
      <path d="M543 661C592 623 581 565 639 553S706 520 752 510V539C711 580 695 588 659 607S600 686 576 709Z" fill="#ffffff" opacity=".11"/>
      <circle cx="650" cy="638" r="101" fill="url(#opticShine)"/>
      <ellipse cx="618" cy="561" rx="68" ry="21" transform="rotate(-22 618 561)" fill="#ffffff" opacity=".21" filter="url(#soft)"/>
    </g>
    <circle cx="650" cy="638" r="101" fill="none" stroke="#eafaff" stroke-opacity=".72" stroke-width="2.2"/>
    <path d="M489 537A201 201 0 0 1 638 437" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    <path d="M649 839A201 201 0 0 0 818 749" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round"/>
  </g>
