name: Agent CLI packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'converter/**'
      - 'cli/**'
      - 'skills/filens/**'
      - 'wasm/converter-core-rust/**'
      - 'wasm/converter-core/manifest/**'
      - 'wasm/converter-image-rust/**'
      - 'wasm/converter-image/manifest/**'
      - 'scripts/*agent*'
      - 'scripts/agent-rust*'
      - 'scripts/model-download*'
      - 'scripts/*privacy*'
      - 'scripts/*pdf-unicode*'
      - 'docs/pdf-unicode*'
      - 'packaging/**'
      - '.github/workflows/agent-cli-packages.yml'

permissions:
  contents: read

jobs:
  native-install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-arm64, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: converter/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Install the pinned Rust/WASI toolchain
        working-directory: wasm/converter-core-rust
        run: rustup show active-toolchain
      - name: Install the Zig Rust linker for Linux and Windows
        if: runner.os != 'macOS'
        run: cargo install cargo-zigbuild --locked --version 0.24.0
      - run: npm ci
      - run: node scripts/setup-agent-upx.mjs
      - run: npm run test:agent:privacy
      - run: npm run test:agent
      - run: npm run test:agent:layout
      - run: node scripts/package-agent-npm.mjs
      - run: npm run test:agent:npm
      - name: Build the Windows portable testing bundle
        if: runner.os == 'Windows'
        run: node scripts/package-agent-windows.mjs
      - name: Test the Windows portable bundles on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundles = Get-ChildItem dist/windows -Directory -Filter 'filens-*-win32-x64-*'
          if ($bundles.Count -ne 2) { throw 'Expected Full and Lite bundles' }
          foreach ($bundle in $bundles) {
            if ($bundle.Name.EndsWith('-full')) {
              node scripts/test-agent-windows-artifacts.mjs $bundle.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            node scripts/test-agent-windows.mjs --bundle $bundle.FullName --report "dist/windows/$($bundle.Name)-test.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-npm-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/npm/*.tgz
            dist/npm/release.json
            dist/windows/*.zip
            dist/windows/*-test.json
