syntax = "proto2";

package TSP;

option go_package = "github.com/IceWhaleTech/iwork-converter/proto/TSP";

import "TSPMessages.proto";

message DatabaseData {
  required DataReference data = 1;
}

message DatabaseDataArchive {
  optional Reference data = 1;
  optional string app_relative_path = 2;
  required string display_name = 3;
  optional uint64 length = 4;
  optional uint32 hash = 5;
  required bool sharable = 6 [default = true];
}

message DatabaseImageDataArchive {
  enum ImageType {
    unknown = 0;
    bitmap = 1;
    pdf = 2;
  }

  required DatabaseDataArchive super = 1;
  required DatabaseImageDataArchive.ImageType type = 2;
}
